
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Conecta Fé</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">✝</span>
      <span>Conecta <b>Fé</b></span>
    </div>
    <button class="icon-button" id="searchButton">⌕</button>
  </header>

  <nav class="categories" id="categories">
    <button class="category active" data-category="Todos">Para você</button>
    <button class="category" data-category="Jesus">Jesus</button>
    <button class="category" data-category="Pregação">Pregações</button>
    <button class="category" data-category="Louvor">Louvores</button>
    <button class="category" data-category="Bíblia">Bíblia</button>
    <button class="category" data-category="Oração">Oração</button>
    <button class="category" data-category="Testemunho">Testemunhos</button>
  </nav>

  <main class="feed" id="feed"></main>

  <section class="welcome" id="welcome">
    <div class="welcome-icon">✝</div>
    <h1>Conecta Fé</h1>
    <p>Uma conexão diária com Jesus.</p>
    <button id="startButton">Começar a assistir</button>
  </section>

  <section class="search-panel" id="searchPanel">
    <div class="search-header">
      <button id="closeSearch" class="back-button">‹</button>
      <input id="searchInput" type="search" placeholder="Buscar vídeos cristãos...">
      <button id="doSearch" class="search-submit">Buscar</button>
    </div>
  </section>

  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home">
      <span>⌂</span><small>Início</small>
    </button>
    <button class="nav-item" data-page="explore">
      <span>⌕</span><small>Explorar</small>
    </button>
    <button class="nav-item" data-page="saved">
      <span>♡</span><small>Salvos</small>
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
